<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewIQ - AI Mock Interview</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .logo-badge {
            background-color: #d8cbf5;
            color: #5c35d4;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            color: #111;
            text-align: center;
            margin-bottom: 25px;
        }
        .question-label {
            font-weight: 600;
            color: #222;
            margin-bottom: 8px;
            display: block;
        }
        .ai-question-box {
            background-color: #fcfcfd;
            border: 1px solid #e2e2e8;
            padding: 12px 15px;
            border-radius: 8px;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #e2e2e8;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #5c35d4;
        }
        .submit-btn {
            background-color: #5c35d4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background-color: #4a2ab0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="logo-badge">IQ</span>
            <span style="font-size: 20px; font-weight: bold; color: #111;">InterviewIQ</span>
        </div>

        <h1>AI Mock Interview</h1>

        <form method="POST" action="/results">
            <!-- Question 1 -->
            <label class="question-label">Question 1 Generated by AI:</label>
            <div class="ai-question-box">What steps would you take to investigate a suspicious login attempt?</div>
            <textarea name="answer1" placeholder="Type your answer ..."></textarea>

            <!-- Question 2 -->
            <label class="question-label">Question 2 Generated by AI:</label>
            <div class="ai-question-box">How would you handle or prevent SQL Injection vulnerabilities in a web application form?</div>
            <textarea name="answer2" placeholder="Type your answer ..."></textarea>

            <!-- Question 3 -->
            <label class="question-label">Question 3 Generated by AI:</label>
            <div class="ai-question-box">What is the principle of least privilege, and why is it crucial for system security?</div>
            <textarea name="answer3" placeholder="Type your answer ..."></textarea>

            <button type="submit" class="submit-btn">Submit Answers</button>
        </form>
    </div>

</body>
</html>
