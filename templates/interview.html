<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>InterviewIQ - Questions</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: auto; /* يسمح بالتمرير الأفقي تماماً مثل اللابتوب إذا فتح من الجوال */
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 650px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .logo-badge {
            background-color: #d8cbf5;
            color: #5c35d4;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        h1 { font-size: 22px; color: #111; text-align: center; margin-bottom: 25px; }
        .question-box { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        textarea {
            width: 100%;
            height: 70px;
            padding: 10px;
            border: 1px solid #e2e2e8;
            border-radius: 8px;
            box-sizing: border-box;
            resize: none;
            font-family: inherit;
        }
        .submit-btn {
            background-color: #5c35d4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover { background-color: #4a2ab0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="logo-badge">IQ</span>
            <span style="font-size: 20px; font-weight: bold; color: #111;">InterviewIQ</span>
        </div>

        <h1>Mock Interview Questions</h1>

        <form method="POST" action="/interview">
            <div class="question-box">
                <label>1. Tell me about yourself and your background in tech.</label>
                <textarea name="answer1" required placeholder="Type your answer here..."></textarea>
            </div>

            <div class="question-box">
                <label>2. How do you handle a challenging bug or technical problem under pressure?</label>
                <textarea name="answer2" required placeholder="Type your answer here..."></textarea>
            </div>

            <div class="question-box">
                <label>3. Where do you see your professional career in the next three years?</label>
                <textarea name="answer3" required placeholder="Type your answer here..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Answers</button>
        </form>
    </div>

</body>
</html>
