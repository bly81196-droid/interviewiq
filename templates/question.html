<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InterviewIQ - Question</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="text-align: center;">
        <div class="logo-area" style="justify-content: center;">
            <div class="logo-box">IQ</div>
            <div class="logo-text">InterviewIQ</div>
        </div>
        
        <h2>AI Mock Interview</h2>
        
        <p style="text-align: left; font-weight: 600; margin-top: 20px;">Question Generated by AI:</p>
        
        <p style="text-align: left; background: #f9f7fc; padding: 15px; border-radius: 6px; border: 1px solid #e2d9ed;">
            What steps would you take to investigate a suspicious login attempt?
        </p>
        
        <form action="{{ url_for('results') }}" method="GET">
            <textarea name="user_answer" placeholder="Type your answer ..." style="width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 20px; resize: none;" required></textarea>
            <br>
            <button type="submit" class="btn" style="width: 100%; cursor: pointer;">Submit Answer</button>
        </form>

    </div>
</body>
</html>
