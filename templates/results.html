<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewIQ - AI Interview Evaluation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 700px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .logo-badge {
            background-color: #d8cbf5;
            color: #5c35d4;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            color: #111;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-box {
            background-color: #d8cbf5;
            color: #5c35d4;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 25px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
        }
        /* الحاوية اللي تجمع المربعين جنب بعض وبشكل متناسق */
        .results-grid {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }
        .eval-box {
            background-color: #d8cbf5;
            border-radius: 10px;
            padding: 15px 20px;
            flex: 1;
            box-sizing: border-box;
        }
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #222;
            cursor: pointer;
        }
        .toggle-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            color: #222;
        }
        .box-content {
            margin-top: 12px;
            display: none; /* تبدأ مغلقة وتفتح لما يضغط المستخدم */
            color: #333;
            font-size: 14px;
            line-height: 1.6;
        }
        .box-content ul {
            padding-left: 20px;
            margin: 0;
        }
        .start-btn {
            background-color: #5c35d4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-btn:hover {
            background-color: #4a2ab0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="logo-badge">IQ</span>
            <span style="font-size: 20px; font-weight: bold; color: #111;">InterviewIQ</span>
        </div>

        <h1>AI Interview Evaluation</h1>

        <div class="score-box">
            Overall Score<br>
            <span style="font-size: 20px;">70 / 100</span>
        </div>

        <!-- المربعين جنب بعض -->
        <div class="results-grid">
            
            <!-- Areas for Improvement -->
            <div class="eval-box">
                <div class="box-header" onclick="toggleBox('imp-content', 'imp-btn')">
                    <span>Areas for Improvement</span>
                    <button class="toggle-btn" id="imp-btn">+</button>
                </div>
                <div class="box-content" id="imp-content">
                    <ul>
                        <li>Provide more project examples</li>
                        <li>Improve answer structure</li>
                        <li>Add more technical details</li>
                    </ul>
                </div>
            </div>

            <!-- Strengths -->
            <div class="eval-box">
                <div class="box-header" onclick="toggleBox('str-content', 'str-btn')">
                    <span>Strengths</span>
                    <button class="toggle-btn" id="str-btn">+</button>
                </div>
                <div class="box-content" id="str-content">
                    <ul>
                        <li>✓ Strong Communication</li>
                        <li>✓ Good Technical Knowledge</li>
                        <li>✓ Clear Problem Solving Skills</li>
                    </ul>
                </div>
            </div>

        </div>

        <form action="/" method="GET">
            <button type="submit" class="start-btn">Start New Interview</button>
        </form>
    </div>

    <script>
        // دالة مستقلة لكل صندوق عشان يفتحون مع بعض بدون ما يتقفل الثاني
        function toggleBox(contentId, btnId) {
            var content = document.getElementById(contentId);
            var btn = document.getElementById(btnId);
            
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.textContent = "+";
            } else {
                content.style.display = "block";
                btn.textContent = "-";
            }
        }
    </script>

</body>
</html>
