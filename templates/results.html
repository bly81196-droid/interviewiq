<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewIQ - AI Interview Evaluation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .logo-badge {
            background-color: #d8cbf5;
            color: #5c35d4;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        h1 { 
            font-size: 20px; 
            color: #111; 
            text-align: center; 
            margin-bottom: 20px; 
        }
        .score-box {
            background-color: #d8cbf5;
            color: #5c35d4;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 20px;
            width: 180px;
            margin-left: auto;
            margin-right: auto;
            font-size: 14px;
        }
        .results-grid {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
        }
        .eval-box {
            background-color: #d8cbf5;
            border-radius: 10px;
            padding: 12px 15px;
            flex: 1;
            box-sizing: border-box;
        }
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #222;
            cursor: pointer;
            font-size: 14px;
        }
        .toggle-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #222;
        }
        .box-content {
            margin-top: 10px;
            display: none;
            color: #333;
            font-size: 13px;
            line-height: 1.5;
        }
        .box-content ul { 
            padding-left: 18px; 
            margin: 0; 
        }
        .start-btn {
            background-color: #5c35d4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.2s;
        }
        .start-btn:hover { 
            background-color: #4a2ab0; 
        }

        /* التصميم الخاص بالجوال لترتيب المربعات تحت بعضها إن لزم الأمر أو تصغير المسافات */
        @media (max-width: 768px) {
            .results-grid {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="logo-badge">IQ</span>
            <span style="font-size: 16px; font-weight: bold; color: #111;">InterviewIQ</span>
        </div>

        <h1>AI Interview Evaluation</h1>

        <!-- الدرجة الديناميكية القادمة من بايثون والـ API -->
        <div class="score-box">
            Overall Score<br>
            <span style="font-size: 18px;">{{ score }} / 100</span>
        </div>

        <div class="results-grid">
            <div class="eval-box">
                <div class="box-header" onclick="toggleBox('imp-content', 'imp-btn')">
                    <span>Areas for Improvement</span>
                    <button class="toggle-btn" id="imp-btn">+</button>
                </div>
                <div class="box-content" id="imp-content">
                    <ul>
                        {% for item in improvements %}
                            <li>{{ item }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

            <div class="eval-box">
                <div class="box-header" onclick="toggleBox('str-content', 'str-btn')">
                    <span>Strengths</span>
                    <button class="toggle-btn" id="str-btn">+</button>
                </div>
                <div class="box-content" id="str-content">
                    <ul>
                        {% for item in strengths %}
                            <li>✓ {{ item }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>

        <a href="/" class="start-btn">Start New Interview</a>
    </div>

    <script>
        function toggleBox(contentId, btnId) {
            var content = document.getElementById(contentId);
            var btn = document.getElementById(btnId);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.textContent = "+";
            } else {
                content.style.display = "block";
                btn.textContent = "-";
            }
        }
    </script>

</body>
</html>
