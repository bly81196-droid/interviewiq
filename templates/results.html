<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>InterviewIQ - Results</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: auto; /* يسمح بالتمرير الأفقي تماماً مثل اللابتوب في الجوال */
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .logo-badge {
            background-color: #d8cbf5;
            color: #5c35d4;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
        }
        h1 {
            font-size: 24px;
            color: #111;
            text-align: center;
            margin-bottom: 25px;
        }
        .score-card {
            background: #d8cbf5;
            color: #5c35d4;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .results-grid {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .eval-box {
            flex: 1;
            background: #f3f0fc;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
        }
        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            font-size: 15px;
        }
        .toggle-btn {
            background: none;
            border: none;
            font-size: 18px;
            font-weight: bold;
            color: #5c35d4;
            cursor: pointer;
        }
        .box-content {
            display: none;
            margin-top: 10px;
            font-size: 14px;
            color: #444;
        }
        .box-content ul {
            padding-left: 20px;
            margin: 0;
        }
        .box-content li {
            margin-bottom: 6px;
        }
        .start-btn {
            background-color: #5c35d4;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .start-btn:hover { background-color: #4a2ab0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="logo-badge">IQ</span>
            <span style="font-size: 20px; font-weight: bold; color: #111;">InterviewIQ</span>
        </div>

        <h1>AI Interview Evaluation</h1>

        <div class="score-card">
            Overall Score: {{ score }} / 100
        </div>

        <div class="results-grid">
            <div class="eval-box">
                <div class="box-header" onclick="toggleBox('imp-content', 'imp-btn')">
                    <span>Areas for Improvement</span>
                    <button class="toggle-btn" id="imp-btn">+</button>
                </div>
                <div class="box-content" id="imp-content">
                    <ul>
                        {% for item in improvements %}
                            <li>{{ item }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

            <div class="eval-box">
                <div class="box-header" onclick="toggleBox('str-content', 'str-btn')">
                    <span>Strengths</span>
                    <button class="toggle-btn" id="str-btn">+</button>
                </div>
                <div class="box-content" id="str-content">
                    <ul>
                        {% for item in strengths %}
                            <li>✓ {{ item }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>

        <a href="/" class="start-btn">Start New Interview</a>
    </div>

    <script>
        function toggleBox(contentId, btnId) {
            var content = document.getElementById(contentId);
            var btn = document.getElementById(btnId);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.textContent = "+";
            } else {
                content.style.display = "block";
                btn.textContent = "-";
            }
        }
    </script>

</body>
</html>
