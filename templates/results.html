<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewIQ - Results</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 500px;
            margin: 20px auto;
            box-sizing: border-box;
        }
        .eval-box {
            margin-top: 20px;
            border: 1px solid #e1e1e8;
            border-radius: 8px;
            overflow: hidden;
        }
        .box-header {
            background-color: #f1f1f6;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
        }
        .box-content {
            padding: 15px;
            display: none;
            background-color: #ffffff;
        }
        .box-content ul {
            margin: 0;
            padding-left: 20px;
        }
        .box-content li {
            margin-bottom: 8px;
            color: #333;
        }
        .toggle-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .start-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 25px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .start-btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI Interview Evaluation</h2>
        <p>Overall Score: <strong>{{ score }} / 100</strong></p>

        <div class="eval-box">
            <div class="box-header" onclick="toggleBox('imp-content', 'imp-btn')">
                <span>Areas for Improvement</span>
                <button class="toggle-btn" id="imp-btn">+</button>
            </div>
            <div class="box-content" id="imp-content">
                <ul>
                    {% for item in improvements %}
                        <li>{{ item }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>

        <div class="eval-box">
            <div class="box-header" onclick="toggleBox('str-content', 'str-btn')">
                <span>Strengths</span>
                <button class="toggle-btn" id="str-btn">+</button>
            </div>
            <div class="box-content" id="str-content">
                <ul>
                    {% for item in strengths %}
                        <li>✓ {{ item }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>

        <a href="/" class="start-btn">Start New Interview</a>
    </div>

    <script>
        function toggleBox(contentId, btnId) {
            var content = document.getElementById(contentId);
            var btn = document.getElementById(btnId);
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.textContent = "+";
            } else {
                content.style.display = "block";
                btn.textContent = "-";
            }
        }
    </script>

</body>
</html>
